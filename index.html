<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Hub</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 50px;
        font-size: 40px;
    }

    .container {
        margin-top: 80px;
    }

    .game-card {
        background: #111827;
        border-radius: 20px;
        padding: 30px;
        margin: 20px auto;
        width: 300px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        transition: transform 0.3s;
    }

    .game-card:hover {
        transform: scale(1.05);
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: #22c55e;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #16a34a;
    }
</style>
</head>

<body>

<h1>🎮 Gaming Hub</h1>

<div class="container">

    <!-- Game 1 -->
    <div class="game-card">
        <h2>Game 1</h2>
        <button onclick="goGame1()">Join Game</button>
    </div>

    <!-- Game 2 -->
    <div class="game-card">
        <h2>Game 2</h2>
        <button onclick="goGame2()">Join Game</button>
    </div>

</div>

<script>
    function goGame1() {
        window.location.href = "https://inlnk.co/OlAJZ";
    }

    function goGame2() {
        window.location.href = "https://inlnk.co/aBXVn";
    }
</script>

</body>
</html>
