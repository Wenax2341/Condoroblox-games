<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gaming Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: repeating-linear-gradient(
    45deg,
    #111 0px,
    #111 20px,
    #151515 20px,
    #151515 40px
  );
  animation: bgMove 10s linear infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

@keyframes bgMove {
  from { background-position: 0 0; }
  to { background-position: 400px 400px; }
}

.container {
  width: 95%;
  max-width: 420px;
  background: rgba(0,0,0,0.75);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 0 35px cyan;
}

h1 {
  text-align: center;
  color: cyan;
  text-shadow: 0 0 15px cyan;
  margin-bottom: 15px;
}

/* BUTTON */
.btn, .music-btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 12px;
  border-radius: 30px;
  border: none;
  text-decoration: none;
  font-weight: bold;
  color: white;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: 0.2s;
}

/* Hover */
.btn:hover, .music-btn:hover {
  transform: scale(1.05);
}

/* Click */
.btn:active, .music-btn:active {
  transform: scale(0.95);
}

/* Ripple */
.btn::after, .music-btn::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
}

.btn:active::after, .music-btn:active::after {
  width: 200px;
  height: 200px;
  opacity: 1;
  transition: 0.4s;
}

/* COLORS */
.music-btn {
  font-family: 'Minecraft', monospace;
  background: linear-gradient(90deg, #00ff88, #00ccff);
  box-shadow: 0 0 20px #00ffcc;
  margin-bottom: 15px;
}

.btn {
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  box-shadow: 0 0 18px #00c6ff;
}

.discord {
  background: linear-gradient(90deg, #5865F2, #404EED);
  box-shadow: 0 0 18px #5865F2;
}

.card {
  background: #111;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 0 18px rgba(0,255,255,0.4);
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

footer {
  text-align: center;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://files.catbox.moe/3v1y8n.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1>🎮 GAMING HUB 🎮</h1>

  <button class="music-btn" id="musicBtn">🔊 MUSIC ON</button>

  <div class="card">
    <img src="game1.jpg" alt="Game One">
    <h2>🔥 Game One</h2>
    <a class="btn" href="https://inlnk.co/sgTWi" target="_blank">Join Game</a>
  </div>

  <div class="card">
    <img src="game2.jpg" alt="Game Two">
    <h2>⚡ Game Two</h2>
    <a class="btn" href="https://inlnk.co/cifXe" target="_blank">Join Game</a>
  </div>

  <div class="card">
    <h2>💬 Discord</h2>
    <a class="btn discord" href="#" target="_blank">Join Discord</a>
  </div>

  <footer>© 2025 Gaming Hub</footer>
</div>

<script>
const music = document.getElementById("music");
const btn = document.getElementById("musicBtn");

let playing = false;

// FIX autoplay (trình duyệt chặn → phải click mới chạy)
document.body.addEventListener("click", function initMusic() {
  music.play().catch(() => {});
  playing = true;
  btn.innerText = "🔊 MUSIC ON";
  document.body.removeEventListener("click", initMusic);
});

// toggle
btn.addEventListener("click", function(e) {
  e.stopPropagation(); // tránh bị click body 2 lần

  if (playing) {
    music.pause();
    btn.innerText = "🔇 MUSIC OFF";
  } else {
    music.play();
    btn.innerText = "🔊 MUSIC ON";
  }

  playing = !playing;
});
</script>

</body>
</html>
