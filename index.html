<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  text-align: center;
}

h1 {
  margin-bottom: 20px;
}

.btn {
  display: block;
  padding: 15px;
  margin: 10px 0;
  border-radius: 30px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  transition: 0.2s;
}

/* hover + click */
.btn:hover {
  transform: scale(1.05);
}

.btn:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="container">
  <h1>🎮 GAME LINKS 🎮</h1>

  <a class="btn" href="https://inlnk.co/sgTWi" target="_blank">
    🔥 Game One
  </a>
  <a class="btn" href="https://inlnk.co/cifXe" target="_blank">
    ⚡ Game Two
  </a>
</div>
</body>
</html>
