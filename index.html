<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gaming Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial;
  min-height: 100vh;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  width: 95%;
  max-width: 420px;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 15px;
}

.btn, .music-btn {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 30px;
  border: none;
  margin-bottom: 10px;
  cursor: pointer;
  color: white;
}

.music-btn {
  background: cyan;
}

.btn {
  background: blue;
}

.card {
  background: #222;
  padding: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://files.catbox.moe/3v1y8n.mp3">
</audio>

<div class="container">
  <h1>🎮 GAMING HUB 🎮</h1>

  <!-- ❌ KHÔNG dùng onclick nữa -->
  <button class="music-btn" id="musicBtn">🔊 MUSIC ON</button>

  <div class="card">
    <h2>Game One</h2>
    <a class="btn" href="https://inlnk.co/sgTWi" target="_blank">Join</a>
  </div>

  <div class="card">
    <h2>Game Two</h2>
    <a class="btn" href="https://inlnk.co/cifXe" target="_blank">Join</a>
  </div>
</div>

<script>
const music = document.getElementById("music");
const btn = document.getElementById("musicBtn");

let playing = false;

// 👉 Click lần đầu để bật nhạc (fix iPhone / Chrome)
document.body.addEventListener("click", function init() {
  music.play().catch(() => {});
  playing = true;
  btn.innerText = "🔊 MUSIC ON";
  document.body.removeEventListener("click", init);
});

// 👉 Nút bật/tắt nhạc
btn.addEventListener("click", function(e) {
  e.stopPropagation();

  if (playing) {
    music.pause();
    btn.innerText = "🔇 MUSIC OFF";
  } else {
    music.play();
    btn.innerText = "🔊 MUSIC ON";
  }

  playing = !playing;
});
</script>

</body>
</html>
